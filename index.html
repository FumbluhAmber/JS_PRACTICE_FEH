<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sum Calculator</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" rel="stylesheet">
    
</head>
<body>
    <div class="container mt-5">
        <details ontoggle="message()" class="mt-5">
            <summary>Instructions</summary>
            <i>Enter two numbers, find its sum & its difference</i>
        </details>
        <form>
            <label>ENTER 1ST NUMBER</label>
            <input type="number" id="num1" placeholder="type here..">
            <br> <br>
            <label>ENTER 2ND NUMBER</label>
            <input type="number" id="num2" placeholder="type here..">
            <br><br>
            <button type="button" onclick="plus()">Addition</button>
            <br><br>
            <button type="button" onclick="minus()">Subtraction</button>

            <h1 id="Result">Answer</h1>
            <h1 id="result">Answer</h1>
        </form>
    </div>
    <script>
        function message() {
            alert("Preview");
        }

        function plus() {
            var add1 = document.getElementById('num1').value;
            var add2 = document.getElementById('num2').value;
            var sum = Number(add1) + Number(add2);
            document.getElementById("Result").innerHTML = 'Answer is ' + sum;
        }
    </script>
    <script>
        function minus() {
            var sub1 = document.getElementById('num1').value;
            var sub2 = document.getElementById('num2').value;
            var diff = Number(sub1) - Number(sub2);
            document.getElementById("result").innerHTML = 'Answer is ' + diff;
        }
    </script>
</body>
</html>
